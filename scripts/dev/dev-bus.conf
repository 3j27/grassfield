<!-- The dev session's private D-Bus session bus (scripts/dev/shell-run.sh starts it with this file).
     It is /usr/share/dbus-1/session.conf (dbus 1.16) without <standard_session_servicedirs/> and without its includes: no
     service folder at all, so nothing of the machine can be started on it (security counter-review of f9e24e1, LOW-2; ADR-0011).
     Its services would inherit the owner's XDG_RUNTIME_DIR: gvfsd mounts $XDG_RUNTIME_DIR/gvfs, gnome-keyring and dconf use
     their folders there, the document portal mounts $XDG_RUNTIME_DIR/doc. The dev session activates nothing: the names it uses
     are owned by processes shell-run.sh starts itself (the shell, the menu bridge); apps and tests connect as clients.
     Checked by tests/security/dev_bus.sh; scripts/dev/dev-bus-check.sh is the guard shell-run.sh runs on the bus it uses.
     No <include>: a session-local.conf or session.d of the machine could add a service folder. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <!-- libdbus caps socket paths at 99 bytes, too short for .dev/ in a worktree. -->
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>

  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>

  <!-- The session bus's limits (session.conf). -->
  <limit name="max_incoming_bytes">1000000000</limit>
  <limit name="max_incoming_unix_fds">250000000</limit>
  <limit name="max_outgoing_bytes">1000000000</limit>
  <limit name="max_outgoing_unix_fds">250000000</limit>
  <limit name="max_message_size">1000000000</limit>
  <limit name="service_start_timeout">120000</limit>
  <limit name="auth_timeout">240000</limit>
  <limit name="pending_fd_timeout">150000</limit>
  <limit name="max_completed_connections">100000</limit>
  <limit name="max_incomplete_connections">10000</limit>
  <limit name="max_connections_per_user">100000</limit>
  <limit name="max_pending_service_starts">10000</limit>
  <limit name="max_names_per_connection">50000</limit>
  <limit name="max_match_rules_per_connection">50000</limit>
  <limit name="max_replies_per_connection">50000</limit>
</busconfig>
