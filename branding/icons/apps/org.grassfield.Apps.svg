<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Grassfield Apps (the Dock's Apps tile): three fanned cards on a light tile, the front one in the brand green
       (ADR-0040 IQ-B5 C, the grammar of the own app icons; no grid of squares, away from macOS's own icon). CC-BY-SA-4.0,
       see branding/LICENSES.md. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F6F4"/>
      <stop offset="1" stop-color="#DDE5DF"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="104" height="104" rx="23.4" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="103" height="103" rx="22.9" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/>
  <rect x="44" y="34" width="40" height="56" rx="9" fill="#3E7BFA" stroke="#FFFFFF" stroke-width="2" transform="rotate(-20 64 100)"/>
  <rect x="44" y="34" width="40" height="56" rx="9" fill="#F5883B" stroke="#FFFFFF" stroke-width="2" transform="rotate(20 64 100)"/>
  <rect x="44" y="34" width="40" height="56" rx="9" fill="#26763F" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="55" y="53" width="18" height="18" rx="5" fill="#FFFFFF" fill-opacity=".9"/>
</svg>
