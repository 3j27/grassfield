# The [grassfield] pacman repository this build points at, and the key it trusts (ADR-0033 b.3, g; docs/specs/updates.md).
# Read by packaging/pacman/generate.py at build time, never sourced: one KEY=value per line, no quotes, no expansion.
# grassfieldhq/grassfield-packages reads the same file from the checkout it builds.
#
# GRASSFIELD_REPO_BASE           the primary base; the channel's Server is <base>/<stable|beta>/$arch. The .invalid
#                                placeholder stays until the owner chooses the host (O8): such a build refuses to set
#                                Grassfield updates up ("no package repository in this build").
# GRASSFIELD_REPO_MIRRORS        more bases serving the same snapshots, space-separated, each a Server line after the primary
# GRASSFIELD_REPO_BASE_PREVIOUS  bases a host change migrates from (ADR-0033 h.3), space-separated
# GRASSFIELD_SIGNING_FINGERPRINT the full fingerprint of the signing key (40 hex digits). Empty until the owner provides the
#                                key (O11): such a build refuses ("no signing key in this build"). The public key is
#                                grassfield-signing-key.asc next to this file, empty until then.
GRASSFIELD_REPO_BASE=https://packages.grassfield.invalid
GRASSFIELD_REPO_MIRRORS=
GRASSFIELD_REPO_BASE_PREVIOUS=
GRASSFIELD_SIGNING_FINGERPRINT=
