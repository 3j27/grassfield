# The Grassfield session's portal routing (ADR-0035 D-4, D-5, D-8). Installed as
# /usr/share/grassfield/xdg/xdg-desktop-portal/hyprland-portals.conf; env-grassfield puts /usr/share/grassfield/xdg first in
# XDG_DATA_DIRS, so xdg-desktop-portal finds this file before the stock /usr/share/xdg-desktop-portal/hyprland-portals.conf
# and the Grassfield .portal files next to it (the Omarchy session sees neither). It lists only the interfaces Grassfield
# serves: for every other one xdg-desktop-portal keeps reading the stock file (hyprland, then gtk), interface by interface
# (checked with xdg-desktop-portal 1.22.1 in tests/integration/portal_settings.sh).
# Settings: Grassfield first, x-d-p-gtk for every key Grassfield does not own (fonts, icons, cursors); the first backend
# that has a key wins (xdg-desktop-portal src/settings.c).
# FileChooser: Grassfield's Open and Save panels (grassfield-portal, D-4); gtk only when the Grassfield .portal file is missing
# when the frontend starts (a half-installed package), never at runtime (the backend forwards to x-d-p-gtk itself when its
# panels cannot show).
# Access: Grassfield's permission alerts (the camera, location, screenshots, the wallpaper, running in the background; the same
# process, D-5); the frontend uses one Access backend, so gtk only as above, and the backend forwards to x-d-p-gtk itself.
[preferred]
org.freedesktop.impl.portal.Settings=grassfield-settings;gtk
org.freedesktop.impl.portal.FileChooser=grassfield;gtk
org.freedesktop.impl.portal.Access=grassfield;gtk
