# Grassfield login (GF-015, owner decision D-2). Installed as /etc/sddm.conf.d/grassfield.conf (a pacman backup file: edit or
# delete it to return to Omarchy's own login). Never touches Omarchy's theme or its own SDDM files.
#
# The drop-in sorts after Omarchy's autologin.conf and 99-omarchy-login.conf, so its values win.

[Autologin]
# Only effective where Omarchy already set an autologin User (encrypted installs): that login now lands in the entry below.
Session=grassfield-login.desktop

[Wayland]
# The Grassfield directory first: Omarchy's theme picks the first session whose name contains "uwsm", and the entry in
# that directory is "Grassfield (uwsm)". It starts Grassfield, or Omarchy when the user chose it: grassfield-login set omarchy
SessionDir=/usr/share/grassfield/sddm/wayland-sessions,/usr/local/share/wayland-sessions,/usr/share/wayland-sessions
