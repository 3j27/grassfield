<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Grassfield session fontconfig (ADR-0003). Installed as /usr/share/grassfield/fontconfig/fonts.conf and selected through
     FONTCONFIG_FILE by packaging/uwsm/env-grassfield, only in the Grassfield desktop session. The Omarchy session never
     sets it. FONTCONFIG_FILE replaces /etc/fonts/fonts.conf, so that file is included first: the system conf.d, the
     user's own ~/.config/fontconfig and Omarchy's 50-omarchy.conf still load, and the rules below run after them.
     Not touched on purpose: monospace (the terminal font is the user's choice), Helvetica and Arial (metric-compatible
     substitutes matter for documents), serif. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- sans-serif and the web "system font" names resolve to Inter. The match is on the requested family, so a font a
       document names explicitly is never replaced. binding="strong" beats Omarchy's strong Liberation Sans. -->
  <match target="pattern">
    <test name="family" qual="first"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <!-- Omarchy's 50-omarchy.conf assigns Liberation Sans over a "sans-serif" request (the generic stays further down the
       list). That first family is told apart from a document that really names Liberation Sans by 30-metric-aliases,
       which adds Arimo to the latter only. Helvetica and Arial requests have neither shape and stay as they are. -->
  <match target="pattern">
    <test name="family" qual="first"><string>Liberation Sans</string></test>
    <test name="family" qual="any"><string>sans-serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>Arimo</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>.AppleSystemUIFont</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>

  <!-- Optical size: at 20 px and above, a request that now leads with Inter gets Inter Display first. Only requests that
       carry a pixel size are affected (GTK, Chromium and Qt set one); Inter itself stays the fallback. -->
  <match target="pattern">
    <test name="family" qual="first"><string>Inter</string></test>
    <test name="pixelsize" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Display</string></edit>
  </match>

  <!-- Rendering: grayscale antialiasing, slight hinting, no LCD filter (closest to the reference on 1x screens). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
