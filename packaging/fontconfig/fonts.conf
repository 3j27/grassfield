<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Grassfield session fontconfig (ADR-0003). Installed as /usr/share/grassfield/fontconfig/fonts.conf and selected through
     FONTCONFIG_FILE by packaging/uwsm/env-grassfield, only in the Grassfield desktop session. The Omarchy session never
     sets it. FONTCONFIG_FILE replaces /etc/fonts/fonts.conf, so that file is included: the system conf.d, the user's own
     ~/.config/fontconfig and Omarchy's 50-omarchy.conf still load.
     Order matters. The family rules come BEFORE the include and insert Inter in place (mode="prepend" inserts just before
     the matched element), so a real family earlier in a list keeps its place and Omarchy's later in-place rewrite of
     sans-serif to Liberation Sans lands behind Inter. The generic names stay in the list: the CJK, Arabic and emoji alias
     chains still fire on them. The rendering rules and the user hook come after the include.
     Not touched on purpose: monospace (the terminal font is the user's choice), Helvetica and Arial (their metric-compatible
     substitutes keep documents laid out), serif. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Sans Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Display</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>.AppleSystemUIFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>

  <!-- A family that is not installed (Segoe UI, Cantarell, ...) falls back to Inter instead of the system default sans.
       Only patterns that name no generic family are touched, and Inter goes last and weak, so explicit Arial and Helvetica
       still get their metric aliases first. -->
  <match target="pattern">
    <test name="family" qual="all" compare="not_eq"><string>sans-serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>sans</string></test>
    <test name="family" qual="all" compare="not_eq"><string>Sans Serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>monospace</string></test>
    <test name="family" qual="all" compare="not_eq"><string>system-ui</string></test>
    <test name="family" qual="all" compare="not_eq"><string>cursive</string></test>
    <test name="family" qual="all" compare="not_eq"><string>fantasy</string></test>
    <test name="family" qual="all" compare="not_eq"><string>emoji</string></test>
    <test name="family" qual="all" compare="not_eq"><string>math</string></test>
    <edit name="family" mode="append_last" binding="weak"><string>Inter</string></edit>
  </match>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The system rules give a family they do not know (Segoe UI, Cantarell, ...) the default "system-ui", and Omarchy's
       rules then put a strong Liberation Sans behind it, which beats the weak Inter above. Put a strong Inter just before
       that system-ui. Known serif, mono and sans families carry their own generic instead and are not touched. -->
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>

  <!-- Optical size: at 20 px and above, a request that leads with Inter gets Inter Display first. Only requests that carry
       a pixel size are affected (GTK, Chromium and Qt set one). -->
  <match target="pattern">
    <test name="family" qual="first"><string>Inter</string></test>
    <test name="pixelsize" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter Display</string></edit>
  </match>

  <!-- Rendering: grayscale antialiasing, slight hinting, no LCD filter (closest to the reference on 1x screens). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- User hook, last: ~/.config/grassfield/fonts.conf (XDG_CONFIG_HOME aware) can override anything above, the family
       choice and the rendering included. Ignored when missing. -->
  <include ignore_missing="yes" prefix="xdg">grassfield/fonts.conf</include>
</fontconfig>
