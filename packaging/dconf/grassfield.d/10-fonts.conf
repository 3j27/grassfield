# Session font defaults (ADR-0003). Defaults only, not locks: the user can still change them (only icon-theme is locked,
# see locks/). Inter at 10 pt: GTK points are 1/72 in at 96 dpi, so 10 pt is 13.3 logical px, the 13 px body size of the
# reference (Adwaita's 11 pt would be 14.7 px). Display scaling is applied by the compositor and does not change this.
# monospace-font-name is left alone: the terminal font is the user's choice.
[org/gnome/desktop/interface]
font-name='Inter 10'
document-font-name='Inter 10'
font-antialiasing='grayscale'
font-hinting='slight'
