# Window controls of apps that draw their own title bar (ADR-0002 "Titlebars", ADR-0015 amendment 2026-10-25, GF-056):
# macOS places close, minimize and zoom on the left, in that order. GTK3 and GTK4/libadwaita header bars (directly or
# through xdg-desktop-portal-gtk's settings) and Chromium's GTK integration read this key. A default, not a lock: the user
# can still change it.
[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:'
