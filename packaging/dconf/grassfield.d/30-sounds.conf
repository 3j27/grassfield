# The session's sound theme (ADR-0047 B-2): Grassfield's own sounds (/usr/share/sounds/grassfield, inheriting freedesktop) for
# the applications that play theme sounds themselves (libcanberra, GSound). Defaults only, not locks. Grassfield's shell plays
# its own effects from Settings > Sound and keeps event-sounds in step with them (on only while interface sounds are on and
# the alert volume is above 0; SoundEffects.gnomeEventSounds), writing the user's value at start and on each change. These
# defaults match Grassfield's own (tests/unit/tst_soundslogic.qml).
[org/gnome/desktop/sound]
theme-name='grassfield'
event-sounds=true
input-feedback-sounds=false
