# Shipped by grassfield-desktop to /usr/lib/systemd/user/bt-agent.service.d/ (ADR-0035 D-11, decision 10-1).
# Omarchy's bt-agent.service runs `bt-agent -c NoInputNoOutput` (bluez-tools), a pairing agent that answers bluetoothd
# without asking anyone. In the Grassfield session grassfield-prompter is the pairing agent, drawn by the shell's secret
# sheet. A second agent would accept an incoming pairing silently whenever it is bluetoothd's default (the last agent to
# ask is: BlueZ src/agent.c add_default_agent), and while the shell is not connected. With no agent at all, bluetoothd
# makes the adapter non-bondable and refuses every pairing step that needs one (src/adapter.c adapter_set_io_capability,
# src/device.c new_auth): nothing is accepted silently.
# GRASSFIELD_SESSION=1 is imported into the systemd user manager by the session's autostart (uwsm finalize), only in the
# Grassfield session. The condition is read only when the unit starts, and Omarchy's unit has no PartOf=: a bt-agent
# started by an Omarchy session would outlive its logout in a user manager that stays (a session switch, a quick log-in
# again) and run on into a Grassfield session (opus review of step 10, MAJOR). PartOf= stops it with the session that
# started it; grassfield-prompter.service also stops one still running before it starts (ADR-0035 decision 10-1). In the
# Omarchy session nothing changes but that: bt-agent starts with the session and stops with it.
# Ordered after graphical-session.target (2026-11-03): Omarchy's unit is WantedBy that target with no ordering, so it
# started (and its condition was read) before autostart.lua's `uwsm finalize` imported GRASSFIELD_SESSION=1: on the
# owner's rc1-17/rc1-18 logins bt-agent ran in the Grassfield session and asked to be bluetoothd's default agent for
# 90 s. After the target, the condition sees the session's variable and skips it (Omarchy's own crash-watch and
# migrate-notify units are ordered the same way).
# bt-agent ignores SIGTERM (it logs "SIGUSR1 received" and keeps running), so a stop waited for the 90 s stop timeout;
# grassfield-prompter.service's synchronous stop of a leftover one timed out its own start with it. 2 s, then SIGKILL.
[Unit]
ConditionEnvironment=!GRASSFIELD_SESSION=1
PartOf=graphical-session.target
After=graphical-session.target

[Service]
TimeoutStopSec=2s
