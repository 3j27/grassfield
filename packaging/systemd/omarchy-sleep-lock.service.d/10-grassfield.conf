# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-sleep-lock.service.d/ (owner decision D-12, 2026-10-23:
# lock before sleep must always happen, as on macOS; this drop-in applies only while grassfield-shell is active).
# Omarchy's unit holds a logind delay inhibitor and, before sleep, asks "the shell" to lock through `omarchy-shell`.
# - While grassfield-shell is active, starting or reloading, the gate skips this unit: grassfield-shell holds its own
#   inhibitor and locks before sleep itself (shell/security/idle/SleepInhibitor.qml).
# - In the Grassfield session when grassfield-shell is not running, this unit runs (grassfield-shell.service starts it
#   with OnFailure= once the shell has failed for good). Its `omarchy-shell` calls reach Grassfield's stand-in
#   (/usr/lib/grassfield/omarchy-shims/omarchy-shell, first in PATH only in this session), which starts grassfield-shell
#   again and asks it to lock; Omarchy's own shell is never involved. If grassfield-shell cannot start within logind's
#   window, the machine sleeps without a lock and Omarchy's script reports it: a known limit (docs/specs/security.md).
# - In the Omarchy session the gate always lets it run, exactly as Omarchy ships it.
[Service]
ExecCondition=/usr/lib/grassfield/sleep-lock-gate
