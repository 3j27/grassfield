# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-sleep-lock.service.d/ (owner decision D-12, 2026-10-23:
# lock before sleep must always happen, as on macOS; this drop-in applies only while grassfield-shell is active).
# Omarchy's unit holds a second sleep inhibitor and, on suspend, asks the Omarchy shell to lock. In the Grassfield session
# that shell does not run while grassfield-shell runs (grassfield-shell locks before sleep itself,
# shell/security/idle/SleepInhibitor.qml), so the request would fail for up to ~12 s, delay the suspend and report
# "Screen did not lock before suspend". The gate skips Omarchy's unit only in the Grassfield session and only while
# grassfield-shell is active, starting or reloading; in every other case (the Omarchy session, grassfield-shell stopped or
# failed) Omarchy's unit runs as Omarchy ships it. grassfield-shell.service also stops it when it starts.
[Service]
ExecCondition=/usr/lib/grassfield/sleep-lock-gate
