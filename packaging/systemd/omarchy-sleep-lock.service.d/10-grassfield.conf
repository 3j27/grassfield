# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-sleep-lock.service.d/.
# Omarchy's unit holds a second sleep inhibitor and, on suspend, asks the Omarchy shell to lock: that shell does not
# run in the Grassfield session (grassfield-shell locks before sleep itself, shell/security/idle/SleepInhibitor.qml),
# so the request would fail for up to ~12 s, delay the suspend and report "Screen did not lock before suspend".
# GRASSFIELD_SESSION=1 is imported into the systemd user manager by the session's autostart (uwsm finalize), only in
# the Grassfield session: the Omarchy session is not affected.
[Unit]
ConditionEnvironment=!GRASSFIELD_SESSION=1
