# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-sleep-lock.service.d/ (owner decision D-12, 2026-10-23:
# lock before sleep must always happen, as on macOS; this drop-in applies only while grassfield-shell is up).
# Omarchy's unit holds a logind delay inhibitor and, before sleep, asks "the shell" to lock through `omarchy-shell`;
# after each sleep it exits and systemd starts it again (Restart=always), which runs this condition again.
# - The gate decides at each start of the unit: it is skipped when grassfield-shell is up (active/running), because
#   grassfield-shell then holds its own inhibitor and locks before sleep itself (shell/security/idle/SleepInhibitor.qml).
#   A copy that started while the shell was not up keeps running until its next sleep: at session start it is started
#   with graphical-session.target, usually before grassfield-shell, and grassfield-shell.service starts it (OnFailure=)
#   after every crash. Running next to the shell is harmless: it only asks grassfield-shell to lock.
# - In the Grassfield session its `omarchy-shell` calls reach Grassfield's stand-in
#   (/usr/lib/grassfield/omarchy-shims/omarchy-shell, first in PATH only in this session), which starts grassfield-shell
#   again when needed and asks it to lock; Omarchy's own shell is never involved. Its clamshell step
#   (omarchy-hyprland-monitor-clamshell) reaches Grassfield's stand-in too, which runs grassfield-lid's own reconcile.
#   If grassfield-shell cannot start within logind's window, the machine sleeps without a lock and Omarchy's script
#   reports it: a known limit (docs/specs/security.md "Lock coverage"); a restarted shell then locks at once.
# - In the Omarchy session the gate always lets it run, exactly as Omarchy ships it.
[Service]
ExecCondition=/usr/lib/grassfield/sleep-lock-gate
