# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-migrate-notify.service.d/ (and the same file for the
# legacy name omarchy-update-user-notify.service).
# Omarchy's toast keeps its click command in a hint only the Omarchy shell understands (omarchy-exec-argv), so the click did
# nothing in Grassfield. grassfield-migrate-notify.service sends a notification whose click opens the migration terminal.
[Unit]
ConditionEnvironment=!GRASSFIELD_SESSION=1
