# Shipped by grassfield-desktop to /usr/lib/systemd/user/owed.service.d/ (Omarchy 4.5.0, ADR-0045 note on the 4.5 platform).
# owed is the video wallpaper daemon of Omarchy's `owe` package: Omarchy 4.5.0's migration 1789764927 (and its first-run
# units) enables it for the graphical session. In the Grassfield session the shell draws the wallpaper itself, video and
# online ones included (Settings > Wallpaper, shell/services/WallpaperVideo.qml), and one program owns the desktop picture,
# as on macOS: a second renderer on the background layer would decode video for nothing and could cover Grassfield's.
# GRASSFIELD_SESSION=1 is imported into the systemd user manager by the session's autostart (uwsm finalize), only in the
# Grassfield session: the Omarchy session is not affected and owed runs there exactly as Omarchy ships it. Nothing of the
# `owe` package is removed, so the unit stays enabled for the user and starts again in an Omarchy session.
[Unit]
ConditionEnvironment=!GRASSFIELD_SESSION=1
