# Shipped by grassfield-desktop to /usr/lib/systemd/user/xdg-desktop-portal.service.d/ (ADR-0035 D-8, decision 2b-14).
# xdg-desktop-portal 1.22.1 creates its proxy for each Settings backend once, when it starts: a backend whose D-Bus activation
# fails then (not started yet, its condition not met) is left out until the frontend restarts, i.e. for the session, and no
# later read starts it again. So in the Grassfield session the Settings backend runs before the frontend starts.
# - In the Grassfield session: the frontend wants grassfield-portal-settings and starts after it (Type=dbus: once its name
#   is on the bus), whatever starts the frontend (D-Bus activation by the first portal client, as usual).
# - In the Omarchy session: grassfield-portal-settings skips itself (ConditionEnvironment=GRASSFIELD_SESSION=1), which
#   neither fails nor delays the frontend; its routing never names the Grassfield backend there either.
#   In the Grassfield session the frontend also reads the session's portals configuration, not the user's: it runs as
#   `env $GRASSFIELD_PORTAL_ENV /usr/lib/xdg-desktop-portal`, and env-grassfield sets GRASSFIELD_PORTAL_ENV to
#   XDG_CONFIG_HOME=/usr/share/grassfield/xdg (the frontend reads one configuration, the first found, and the user's comes
#   first: Omarchy 4.5.0's migration 1788261467 writes ~/.config/xdg-desktop-portal/hyprland-portals.conf, which would send
#   every interface Grassfield serves to gtk). Systemd drops the unquoted `$GRASSFIELD_PORTAL_ENV` word when the variable is
#   unset, so the Omarchy session runs `env /usr/lib/xdg-desktop-portal`, the unit's own command. The path is the stock
#   unit's ExecStart (tests/integration/portal_settings.sh compares them).
[Unit]
Wants=grassfield-portal-settings.service
After=grassfield-portal-settings.service

[Service]
ExecStart=
ExecStart=/usr/bin/env $GRASSFIELD_PORTAL_ENV /usr/lib/xdg-desktop-portal
