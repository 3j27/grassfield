# Shipped by grassfield-desktop to /usr/lib/systemd/user/omarchy-crash-watch.service.d/.
# Omarchy's watcher announces through the Omarchy shell's notification IPC (omarchy-notification-wait), which does not run
# in the Grassfield session, so it could never notify there. grassfield-crash-watch.service does the job in this session.
# GRASSFIELD_SESSION=1 is imported into the systemd user manager by the session's autostart (uwsm finalize), only in the
# Grassfield session: the Omarchy session is not affected.
[Unit]
ConditionEnvironment=!GRASSFIELD_SESSION=1
