<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Test fixture (own drawing): a tile at 80 percent of the box, with a soft drop shadow under it (low alpha, outside the tile). -->
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD6A0"/><stop offset="1" stop-color="#2E9E5B"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="13" y="19" width="102" height="102" rx="23" fill="#000000" fill-opacity="0.35" filter="url(#s)"/>
  <rect x="13" y="13" width="102" height="102" rx="23" fill="url(#p)"/>
  <circle cx="64" cy="64" r="22" fill="#FFFFFF"/>
</svg>
